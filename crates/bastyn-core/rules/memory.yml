      - "$GRAPH.stream($$$ARGS, config={'configurable': {$$$PRE, 'thread_id': '$TID'}})"
      - "$GRAPH.stream($$$ARGS, config={'configurable': {$$$PRE, 'thread_id': '$TID', $$$MORE}})"
      - "$GRAPH.stream($$$ARGS, config={'configurable': {'thread_id': '$TID'}})"
      - "$GRAPH.stream($$$ARGS, {'configurable': {'thread_id': '$TID', $$$MORE}})"
      - "$GRAPH.stream($$$ARGS, {'configurable': {$$$PRE, 'thread_id': '$TID'}})"
      - "$GRAPH.stream($$$ARGS, {'configurable': {$$$PRE, 'thread_id': '$TID', $$$MORE}})"
      - "$GRAPH.stream($$$ARGS, {'configurable': {'thread_id': '$TID'}})"
    description: >
      A LangGraph invocation passes a literal string as thread_id inside
      config.configurable, instead of a value derived from the current
      request. Every caller collapses onto the same checkpoint thread, so
      one user's conversation state (and tool-call history) becomes
      readable and continuable by the next.
    remediation: >
      Derive thread_id from the authenticated session or conversation id
      for this request (e.g. `str(session.id)`), never a fixed literal.
      Fixed threads are legitimate for admin/debug tooling and scheduled
      jobs that intentionally reuse one thread -- if that is the case here,
      the value should still not be a bare literal at the call site;
      isolate it in a clearly named constant so it reads as deliberate.

  # ---------------------------------------------------------------------
  # ZT2 -- Least Agency and Access.
  # ---------------------------------------------------------------------

  - id: BAS-ZT2-010
    title: ShellToolMiddleware instantiated with no execution policy
    kind: observation
    severity: medium
    confidence: medium
    categories: [ZT2]
    language: python
    any:
      - "ShellToolMiddleware()"
      - "$$$MOD.ShellToolMiddleware()"
    description: >
      LangChain's ShellToolMiddleware() is instantiated with no arguments,
      which defaults to HostExecutionPolicy -- full host shell access
      exposed directly to the agent, with no sandbox or command allowlist
      in front of it.
    remediation: >
      Pass an explicit ExecutionPolicy (a sandboxed or allowlisted policy)
      to ShellToolMiddleware. If the whole process already runs inside a
      locked-down container with no other tenants, document that at the
      call site rather than leaving the default silently in place.

  # ---------------------------------------------------------------------
  # LLM03 -- Excessive Agency.
  # ---------------------------------------------------------------------

  - id: BAS-LLM03-030
    title: MCP tool declared destructive is invoked with no confirmation guard
    kind: defect
    severity: high
    confidence: medium
    categories: [LLM03]
    language: python
    any:
      - "def $FN($$$ARGS):\n    $$$BODY"
      - "def $FN($$$ARGS) -> $RET:\n    $$$BODY"
      - "async def $FN($$$ARGS):\n    $$$BODY"
      - "async def $FN($$$ARGS) -> $RET:\n    $$$BODY"
    # Same guard-shape exclusions BAS-LLM03-001 uses: enumerating every
    # possible guard shape is structurally incomplete (a guard can live in
    # a decorator or in middleware this rule can't see), which is why
    # confidence stays medium rather than high.
    none:
      - "def $FN($$$ARGS):\n    $$$PRE\n    if not $COND:\n        raise $EXC\n    $$$REST"
      - "def $FN($$$ARGS):\n    $$$PRE\n    if not $COND:\n        return $EARLY\n    $$$REST"
      - "def $FN($$$ARGS) -> $RET:\n    $$$PRE\n    if not $COND:\n        raise $EXC\n    $$$REST"
      - "def $FN($$$ARGS) -> $RET:\n    $$$PRE\n    if not $COND:\n        return $EARLY\n    $$$REST"
      - "def $FN($$$ARGS):\n    $$$PRE\n    assert $COND, $MSG\n    $$$REST"
      - "def $FN($$$ARGS):\n    $$$PRE\n    assert $COND\n    $$$REST"
      - "def $FN($$$ARGS) -> $RET:\n    $$$PRE\n    assert $COND, $MSG\n    $$$REST"
      - "def $FN($$$ARGS) -> $RET:\n    $$$PRE\n    assert $COND\n    $$$REST"
      - "async def $FN($$$ARGS):\n    $$$PRE\n    if not $COND:\n        raise $EXC\n    $$$REST"
      - "async def $FN($$$ARGS):\n    $$$PRE\n    if not $COND:\n        return $EARLY\n    $$$REST"
      - "async def $FN($$$ARGS) -> $RET:\n    $$$PRE\n    if not $COND:\n        raise $EXC\n    $$$REST"
      - "async def $FN($$$ARGS) -> $RET:\n    $$$PRE\n    if not $COND:\n        return $EARLY\n    $$$REST"
      - "async def $FN($$$ARGS):\n    $$$PRE\n    assert $COND, $MSG\n    $$$REST"
      - "async def $FN($$$ARGS):\n    $$$PRE\n    assert $COND\n    $$$REST"
      - "async def $FN($$$ARGS) -> $RET:\n    $$$PRE\n    assert $COND, $MSG\n    $$$REST"
      - "async def $FN($$$ARGS) -> $RET:\n    $$$PRE\n    assert $COND\n    $$$REST"
    # Anchors on the tool's own declared MCP annotation, not a guess at
    # intent from its name: `destructiveHint=True` is the SDK's own field
    # for exactly this.
    inside:
      - "@$MCP.tool(annotations=ToolAnnotations(destructiveHint=True))\ndef $FN2($$$A):\n    $$$B"
      - "@$MCP.tool(annotations=ToolAnnotations(destructiveHint=True))\ndef $FN2($$$A) -> $RET2:\n    $$$B"
      - "@$MCP.tool(annotations=ToolAnnotations(destructiveHint=True))\nasync def $FN2($$$A):\n    $$$B"
      - "@$MCP.tool(annotations=ToolAnnotations(destructiveHint=True))\nasync def $FN2($$$A) -> $RET2:\n    $$$B"
      - "@$MCP.tool(annotations=ToolAnnotations($$$PRE, destructiveHint=True))\ndef $FN2($$$A):\n    $$$B"
      - "@$MCP.tool(annotations=ToolAnnotations($$$PRE, destructiveHint=True))\ndef $FN2($$$A) -> $RET2:\n    $$$B"
      - "@$MCP.tool(annotations=ToolAnnotations($$$PRE, destructiveHint=True))\nasync def $FN2($$$A):\n    $$$B"
      - "@$MCP.tool(annotations=ToolAnnotations($$$PRE, destructiveHint=True))\nasync def $FN2($$$A) -> $RET2:\n    $$$B"
      - "@$MCP.tool(annotations={\"destructiveHint\": True})\ndef $FN2($$$A):\n    $$$B"
      - "@$MCP.tool(annotations={\"destructiveHint\": True})\ndef $FN2($$$A) -> $RET2:\n    $$$B"
      - "@$MCP.tool(annotations={\"destructiveHint\": True})\nasync def $FN2($$$A):\n    $$$B"
      - "@$MCP.tool(annotations={\"destructiveHint\": True})\nasync def $FN2($$$A) -> $RET2:\n    $$$B"
      - "@$MCP.tool(annotations={$$$PRE, \"destructiveHint\": True})\ndef $FN2($$$A):\n    $$$B"
      - "@$MCP.tool(annotations={$$$PRE, \"destructiveHint\": True})\ndef $FN2($$$A) -> $RET2:\n    $$$B"
      - "@$MCP.tool(annotations={$$$PRE, \"destructiveHint\": True})\nasync def $FN2($$$A):\n    $$$B"
      - "@$MCP.tool(annotations={$$$PRE, \"destructiveHint\": True})\nasync def $FN2($$$A) -> $RET2:\n    $$$B"
    description: >
      A tool's own MCP annotation declares it destructive
      (destructiveHint=True), but its handler runs unconditionally: there
      is no guard clause checking a confirmation or authorization condition
      before it acts. Unlike a name-based guess at intent, this grounds on
      metadata the tool author already declared.
    remediation: >
      Require explicit confirmation or an authorization check at the top of
      the handler before a destructive tool executes. If approval is
      enforced by an out-of-repo policy engine, document that at the call
      site.

  # ---------------------------------------------------------------------
  # LLM06 (Unbounded Consumption) and LLM09 (Vector and Embedding
  # Weaknesses) were both attempted here and dropped after measurement on
  # the 65-repo calibration corpus (2026-08-28), not before:
  #
  # - LLM06.1 (unbounded while-True agent loop, plus AgentExecutor with no
  #   max_iterations): 5 real findings, 0 true positives. The while-True
  #   variant collided with `asyncio.run(...)` (a completely unrelated
  #   stdlib idiom that happens to match `$AGENT.run($$$A)`), missed a
  #   break hidden in an `if/else` branch's `else:` arm (a real gap in the
  #   `none:` exclusion list), and flagged a human-paced CLI REPL loop
  #   (`while True: input(...); graph.invoke(...)`) that cannot run away
  #   unattended the way the rule's own threat model assumes. The
  #   AgentExecutor variant flagged a same-named class the target repo
  #   defined itself (`from marketbot.agent.executor import
  #   AgentExecutor`), not LangChain's -- distinguishing the two needs
  #   import-tracing this engine's any/none/inside primitives cannot do.
  # - LLM09.1 (vector-DB query missing a namespace/tenant/filter kwarg,
  #   all three vendor shapes: Pinecone, Qdrant, Chroma): 17 real findings,
  #   0 true positives. `top_k=`/`vector=`/`query_embeddings=` turned out
  #   to be far weaker anchors than they looked in isolation -- every
  #   third-party AI repo in this corpus that uses a vector store is a
  #   single-user or self-hosted tool (a personal research assistant, a
  #   local RAG app), so "no namespace" is the correct, unremarkable shape
  #   rather than a defect. This is exactly the false-positive risk the
  #   catalogue itself named for this entry, just more total than
  #   expected. The one real Qdrant call in the corpus (BAS-LLM09-002's
  #   target shape) was already correctly scoped, so that variant never
  #   fired at all -- but it rests on the identical "assume multi-tenancy"
  #   premise that failed for its two siblings, and nothing in this corpus
  #   supports it either, so it is dropped along with them rather than
  #   kept on no evidence.
  #
  # Full adjudication (each finding read at its actual source line, not
  # from this rule's own description) is in the PR/commit history for this
  # change, not reproduced here.
