name: Bug report
description: Bastyn did something wrong, or stopped working.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for security vulnerabilities in Bastyn itself.
        see [SECURITY.md](https://github.com/BASTYN-labs/bastyn-scan/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The exact command, and the tree it ran against. A minimal repository is ideal.
      placeholder: |
        1. Directory contains `src/main.rs` and a `.gitignore` with `target/`
        2. Run `bastyn scan --format json`
        3. Output omits `src/main.rs`
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Bastyn version
      description: Output of `bastyn --version`.
      placeholder: bastyn 0.1.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: install
    attributes:
      label: How was it installed
      placeholder: pre-built release binary / cargo build --release / cargo install
    validations:
      required: false

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Full stdout and stderr, including any error text.
      render: console
    validations:
      required: false
