# ---------------------------------------------------------------------
# vulnerable/real_misses/eval_guarded_by_local_check.py — the two entries
# below run in the *opposite* direction from every `[[known_gap]]` above,
# which is why they are a distinct entry type, `[[known_false_positive]]`,
# rather than known_gap entries. A known_gap is a recall gap: a real defect
# the engine is expected to miss. These are a precision gap: a safe call
# BAS-LLM10-004 is expected to keep flagging anyway, because proving it
# safe needs seeing a sibling statement (a prior assignment or guard
# clause) that `none:`/`inside:` cannot reach -- both only ever look at the
# matched node itself or its ancestors, never a sibling. See the file's own
# docstring for the full investigation.
#
# Recorded here anyway, per this codebase's practice of writing every known
# limitation down rather than leaving it silently untested (see README.md's
# "detection is recorded as a known_gap, not quietly left out" -- the same
# practice applies to known_false_positive). `corpus_gate`'s
# `find_promotable` only ever looks at `[[known_gap]]` entries, so these two
# can never trigger its "promote to [[expect]]" suggestion -- that
# suggestion would have been wrong here: promoting either of these to
# `[[expect]]` would assert code that is provably not vulnerable is a
# defect. They were briefly filed as `[[known_gap]]` before this entry type
# existed, which produced exactly that wrong suggestion every run; see
# corpus_gate.rs's MAX_KNOWN_GAPS history comment for that correction.
# ---------------------------------------------------------------------

[[known_false_positive]]
file     = "vulnerable/real_misses/eval_guarded_by_local_check.py"
line     = 65
category = "LLM10"
why      = "eval(class_name) where class_name can only ever be self.__class__.__name__ of a closed set of subclasses defined in this module -- not attacker-influenceable. The taint-safety proof lives at class_name's assignment one line above the call, which `none:` cannot see (it only matches alternate shapes of the eval() call node itself)."

[[known_false_positive]]
file     = "vulnerable/real_misses/eval_guarded_by_local_check.py"
line     = 81
category = "LLM10"
why      = "eval(f\"torch.{torch_dtype}\") guarded one line above by an exact-match check against a 3-item whitelist that raises before eval() is ever reached. The guard is a sibling if/raise statement, not part of the eval() call's own node, so `none:` (same-node exclusion) and `inside:` (ancestor constraint) both structurally cannot express it."

