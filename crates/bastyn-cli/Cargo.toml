[package]
name = "bastyn"
description = "Single-binary static analysis for AI and agent code."
default-run = "bastyn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "bastyn"
path = "src/main.rs"

[dependencies]
bastyn-core = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Lets the integration tests point the summary uploader at a local listener and
# shorten its timeouts. Off by default: release builds do not enable it, and
# without it the binary can only send to the production address.
test-endpoint = ["bastyn-core/test-endpoint"]

[dev-dependencies]
assert_cmd = { workspace = true }
boon = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
