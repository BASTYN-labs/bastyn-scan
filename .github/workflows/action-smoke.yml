name: Action smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest      # Linux X64
          - ubuntu-24.04-arm   # Linux ARM64 -- the case the old action got wrong
          - macos-latest       # macOS ARM64
          - macos-15-intel     # macOS X64  -- the other case it got wrong
          - windows-latest     # Windows X64
    steps:
      - uses: actions/checkout@v7
      - name: Report what runner this is
        shell: bash
        run: echo "RUNNER_OS=$RUNNER_OS RUNNER_ARCH=$RUNNER_ARCH"
      # The action as it stands in this tree, not the last release -- so a
      # broken action is caught before it ships, not after.
      - name: Run Bastyn via the action in this tree
        id: scan
        uses: ./
        continue-on-error: true
        with:
          path: tests/fixtures/vulnerable_agent
          offline: "true"
          fail-on: high
      - name: Assert the action reported the planted defects
        shell: bash
        env:
          CODE: ${{ steps.scan.outputs.exit-code }}
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: |
          echo "exit-code='$CODE'  sarif-file='$SARIF'"
          # An empty exit-code means the action swallowed its own output --
          # which is what a failing step inside a composite action does to
          # the outputs it already wrote. Distinguish that from a wrong code.
          [ -n "$CODE" ] \
            || { echo "::error::exit-code output is empty; the action lost it"; exit 1; }
          [ "$CODE" = "1" ] \
            || { echo "::error::expected exit 1 on the vulnerable fixture, got $CODE"; exit 1; }
          [ -s "$SARIF" ] \
            || { echo "::error::no SARIF written to '$SARIF'"; exit 1; }
      # Every fixture file is Python, so excluding *.py should leave nothing
      # to flag. This also exercises the composite script's array handling
      # on the runner's actual `bash` -- macOS resolves that to the system's
      # bash 3.2, where an empty array under `set -u` has bitten this step
      # before.
      - name: Run Bastyn via the action, excluding every file in the fixture
        id: scan-excluded
        uses: ./
        continue-on-error: true
        with:
          path: tests/fixtures/vulnerable_agent
          exclude: "*.py"
          offline: "true"
          fail-on: high
          sarif-file: bastyn-excluded.sarif
      - name: Assert the exclude input suppressed every planted defect
        shell: bash
        env:
          CODE: ${{ steps.scan-excluded.outputs.exit-code }}
        run: |
          echo "exit-code='$CODE'"
          [ "$CODE" = "0" ] \
            || { echo "::error::expected exit 0 with every file excluded, got $CODE"; exit 1; }
