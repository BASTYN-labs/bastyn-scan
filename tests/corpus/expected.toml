# [[known_gap]], never [[expect]], regardless of how closely the code
# shape resembles a pattern that already exists for Python -- per
# FORMAT.md, a known_gap that turns out to be caught is a trivial
# promotion, but a wrong [[expect]] breaks the build for whoever merges
# TS support next. Written using the real APIs of LangChain.js
# (@langchain/core, @langchain/openai), the Vercel AI SDK (ai,
# @ai-sdk/openai), and the official MCP TypeScript SDK
# (@modelcontextprotocol/sdk) -- verified to type-check against the real
# published packages (see the corpus task's report for the tsc command
# used). Variable names follow real developer usage (runbookText,
# suggestion, assistantNote, customerMessage) rather than the
# response/reply/user/input-shaped names a naming-based rule would key
# on -- deliberately, per the corpus's own standard: a corpus shaped to
# match visible rules only proves a rule matches its own fixture.
#
# Every [[expect_none]] entry in this section stands on its own, though:
# a scanner that produces zero findings on a clean file is correct
# regardless of whether it understands TypeScript at all yet.
# =====================================================================

